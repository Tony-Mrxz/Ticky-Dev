name: Build Ticky Release Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y

      # Compiles the onedir bundle, stages the offline Whisper model and builds
      # installer\output\Ticky-Setup-<version>.exe. No display on a CI runner, so
      # the bundle is not launched as a smoke test.
      - name: Build setup exe
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File build_installer.ps1 -SkipSmoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ticky-Windows
          path: installer/output/Ticky-Setup-*.exe
          retention-days: 3
          if-no-files-found: error

  build-macos:
    name: Build macOS bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean build directories
        run: rm -rf build dist

      - name: Build with PyInstaller and Package DMG
        run: |
          pyinstaller --clean --noconfirm Ticky.spec
          hdiutil create -fs HFS+ -volname "Ticky" -srcfolder dist/Ticky.app dist/Ticky.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ticky-macOS
          path: dist/Ticky.dmg
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Ticky-Windows
          path: release-assets/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: Ticky-macOS
          path: release-assets/macos

      - name: Prepare assets
        run: |
          mkdir -p dist
          mv release-assets/windows/Ticky-Setup-*.exe dist/
          # Stable alias so the website can link one permanent URL:
          # .../releases/latest/download/Ticky-Setup.exe
          setup=$(ls dist/Ticky-Setup-*.exe | head -n1)
          cp "$setup" dist/Ticky-Setup.exe
          mv release-assets/macos/Ticky.dmg dist/Ticky.dmg

      - name: Release Latest Binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing 'latest' release and both remote & local tags
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          git tag -d latest || true

          # Create new release pointing at current HEAD.
          # Not a prerelease: /repos/.../releases/latest ignores prereleases, and the
          # in-app update check reads exactly that endpoint.
          gh release create latest dist/* \
            --title "Ticky Latest Build" \
            --notes "Automated continuous delivery build of the latest commit on main branch. Windows: run Ticky-Setup, no Python needed. macOS: mount the dmg and drag Ticky.app to Applications." \
            --target ${{ github.sha }}

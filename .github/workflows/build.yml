name: Build Ticky Release Binaries

# Windows only for now. The macOS bundle recipe still exists (Ticky.spec builds
# dist/Ticky.app on darwin, package_mac.py wraps it) but its job is parked, so
# nothing publishes a Ticky.dmg and no download link should point at one.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the interpreter the app is developed and smoke-tested on, so
          # the published binary is not built by a Python nobody has run it under.
          python-version: '3.14.5'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails in seconds on a missing module instead of after a ten-minute
      # PyInstaller run.
      - name: Verify the app imports
        run: >
          python -c "import main, ui.main_window, widgets.notch_widget,
          ui.onboarding_window, utils.update_checker, utils.version"

      - name: Install Inno Setup
        run: choco install innosetup -y

      # Compiles the onedir bundle, stages the offline Whisper model and builds
      # installer\output\Ticky-Setup-<version>.exe. No display on a CI runner, so
      # the bundle is not launched as a smoke test.
      - name: Build setup exe
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File build_installer.ps1 -SkipSmoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ticky-Windows
          path: installer/output/Ticky-Setup-*.exe
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Ticky-Windows
          path: release-assets/windows

      - name: Prepare assets
        run: |
          mkdir -p dist
          mv release-assets/windows/Ticky-Setup-*.exe dist/
          # Stable alias so the website can link one permanent URL:
          # .../releases/latest/download/Ticky-Setup.exe
          setup=$(ls dist/Ticky-Setup-*.exe | head -n1)
          cp "$setup" dist/Ticky-Setup.exe

      - name: Release Latest Binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing 'latest' release and both remote & local tags
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          git tag -d latest || true

          # Create new release pointing at current HEAD.
          # Not a prerelease: /repos/.../releases/latest ignores prereleases, and the
          # in-app update check reads exactly that endpoint.
          gh release create latest dist/* \
            --title "Ticky Latest Build" \
            --notes "Automated continuous delivery build of the latest commit on main branch. Windows 10/11 x64: run Ticky-Setup, no Python needed." \
            --target ${{ github.sha }}

name: Build Ticky Release Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: Ticky-Windows
            output-path: dist/Ticky.exe
          - os: macos-latest
            artifact-name: Ticky-macOS
            output-path: dist/Ticky.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller Ticky.spec

      - name: Build with PyInstaller and Package DMG (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller Ticky.spec
          hdiutil create -fs HFS+ -volname "Ticky" -srcfolder dist/Ticky.app dist/Ticky.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.output-path }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: Ticky-Windows
          path: release-assets/windows

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: Ticky-macOS
          path: release-assets/macos

      - name: Prepare assets
        run: |
          mkdir -p dist
          mv release-assets/windows/Ticky.exe dist/Ticky.exe
          mv release-assets/macos/Ticky.dmg dist/Ticky.dmg

      - name: Release Latest Binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing 'latest' tag & release if they exist
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
          
          # Create new release
          gh release create latest dist/* \
            --title "Ticky Latest Build" \
            --notes "Automated continuous delivery build of the latest commit on main branch." \
            --prerelease
